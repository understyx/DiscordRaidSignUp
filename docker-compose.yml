version: "3.9"
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: raidbot
      MYSQL_USER: raidbot
      MYSQL_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/mysql
      - ./items.sql:/docker-entrypoint-initdb.d/items.sql

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  db_data:
