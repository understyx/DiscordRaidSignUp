<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raiding.site</title>
  <meta name="description" content="Open your guild raid site, explore the demo, or visit the armory." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>
  <main class="container">
    <div class="row justify-content-center mt-5 pt-md-5">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 text-center shadow">
          <h1 class="h2 mb-2">⚔️ Raiding.site</h1>
          <p class="text-muted mb-4">Choose where you want to go.</p>
          <div class="d-grid gap-3">
            <a class="btn btn-wow btn-lg" href="/auth/login">Login to guild</a>
            <a class="btn btn-outline-light btn-lg" href="{{ links.demo }}/raids">Explore demo</a>
            <a class="btn btn-outline-light btn-lg" href="{{ links.armory }}">Armory</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
