<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raiding.site</title>
  <meta name="description" content="Open your guild raid site, explore the demo, or visit the armory." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body class="landing-body">
  <main class="container landing-shell">
    <section class="landing-card" aria-labelledby="landing-title">
      <div class="landing-heading">
        <span class="landing-mark" aria-hidden="true">⚔️</span>
        <div>
          <h1 id="landing-title">Raiding.site</h1>
          <p>Raid planning for Discord guilds.</p>
        </div>
      </div>

      <div class="landing-actions">
        <a class="landing-action landing-action-primary" href="/auth/login">
          <span class="landing-action-icon" aria-hidden="true">🏰</span>
          <span><strong>Login to guild</strong><small>Open your guild’s raid page</small></span>
          <span aria-hidden="true">→</span>
        </a>
        <a class="landing-action" href="{{ links.demo }}/raids">
          <span class="landing-action-icon" aria-hidden="true">🧪</span>
          <span><strong>Explore demo</strong><small>Try raid comps with fake data</small></span>
          <span aria-hidden="true">→</span>
        </a>
        <a class="landing-action" href="{{ links.armory }}">
          <span class="landing-action-icon" aria-hidden="true">🛡️</span>
          <span><strong>Armory</strong><small>Look up characters and gear</small></span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      {% if bot_invite_url %}
      <div class="landing-invite">
        <span>Setting up a new guild?</span>
        <a href="{{ bot_invite_url }}" target="_blank" rel="noopener noreferrer">Invite Discord bot ↗</a>
      </div>
      {% endif %}
    </section>
  </main>
</body>
</html>
